{% extends "base.html" %}
{% block content %}
<h2 class="slide-in-top">Редактирование предмета #{{ item.inventory_number }}</h2>

<div class="card card-custom fade-in-card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('manager_edit_item', item_id=item.id) }}">
            <div class="mb-3">
                <label for="name" class="form-label">Название</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ item.name }}" required>
            </div>
            <div class="mb-3">
                <label for="inventory_number" class="form-label">Инвентарный номер</label>
                <input type="text" class="form-control" id="inventory_number" name="inventory_number" value="{{ item.inventory_number }}" required>
            </div>
            <div class="mb-3">
                <label for="condition" class="form-label">Состояние</label>
                <select class="form-select" id="condition" name="condition" required>
                    <option value="new" {% if item.condition == 'new' %}selected{% endif %}>Новый</option>
                    <option value="in_use" {% if item.condition == 'in_use' %}selected{% endif %}>В использовании</option>
                    <option value="broken" {% if item.condition == 'broken' %}selected{% endif %}>Сломан</option>
                    <option value="decommissioned" {% if item.condition == 'decommissioned' %}selected{% endif %}>Списан</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="is_available" class="form-label">Доступность</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_available" name="is_available" {% if item.is_available %}checked{% endif %}>
                    <label class="form-check-label" for="is_available">
                        Предмет доступен для выдачи
                    </label>
                </div>
            </div>
            <div class="mb-3">
                <label for="assigned_user_id" class="form-label">Назначить пользователю</label>
                <select class="form-select" id="assigned_user_id" name="assigned_user_id">
                    <option value="none">Никому</option>
                    {% for user in all_users %}
                    <option value="{{ user.id }}" {% if item.assigned_to == user.id %}selected{% endif %}>
                        {{ user.username }} {% if user.full_name %}({{ user.full_name }}){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>
                При назначении пользователю предмет автоматически становится недоступным для выдачи другим.
            </div>
            <button type="submit" class="btn btn-primary bounce-on-hover">Сохранить изменения</button>
            <a href="{{ url_for('manager_inventory') }}" class="btn btn-secondary bounce-on-hover">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
